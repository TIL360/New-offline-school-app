<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Class Management</title>
<style>
  body{font-family:'Segoe UI',sans-serif;background:#f8f9ff;margin:0;padding:20px}
  .dashboard-btn{border:1px solid #ddd;background:white;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600;position:fixed;top:15px;left:15px}
  .card{max-width:800px;margin:60px auto;background:white;padding:25px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.06)}
  h2{color:#5a4cf0;margin-top:0;border-bottom:1px solid #eee;padding-bottom:12px}
  .input-row{display:flex;gap:10px;margin:20px 0}
  .input-row input{flex:1;padding:10px 12px;border:1.5px solid #6d5df5;border-radius:6px;outline:none}
  .input-row button{background:#5a4cf0;color:white;border:none;padding:10px 18px;border-radius:6px;font-weight:600;cursor:pointer}
  table{width:100%;border-collapse:collapse} th{background:#f1f3f9;padding:10px;text-align:left;font-size:0.8rem;color:#666} td{padding:12px 10px;border-bottom:1px solid #f0f0f0}
  .action-btn{background:none;border:none;cursor:pointer;font-size:16px;margin:0 2px}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:9999}
  .modal-overlay.show{display:flex}
  .modal-box{background:white;width:360px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.2);overflow:hidden}
  .modal-head{padding:12px 16px;font-weight:600;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
  .modal-body{padding:20px 16px;font-size:14px} .modal-foot{padding:10px 16px;background:#f5f5f5;display:flex;justify-content:flex-end;gap:10px}
  .modal-foot button{padding:6px 14px;border-radius:4px;border:1px solid #ddd;cursor:pointer;font-weight:600}
  .btn-ok{background:#5a4cf0!important;color:white!important;border-color:#5a4cf0!important} .close-x{cursor:pointer}
</style>
</head>
<body>

<button class="dashboard-btn" onclick="location.href='../dashboard.html'">Dashboard</button>

<div class="card">
  <h2>Class Management</h2>
  <div class="input-row">
    <input id="classInput" placeholder="Add new class (e.g. Nursery, Matric)" onkeydown="if(event.key==='Enter') saveClass()">
    <button id="saveBtn" onclick="saveClass()">Add Class</button>
  </div>
  <table>
    <thead><tr><th>SER.</th><th>CLASS NAME</th><th style="text-align:center">ACTIONS</th></tr></thead>
    <tbody id="classTableBody"></tbody>
  </table>
</div>

<div id="deleteModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-head">edupulse-2026 <span class="close-x" onclick="closeModal()">×</span></div>
    <div class="modal-body">Are you sure you want to delete this class?</div>
    <div class="modal-foot">
      <button class="btn-ok" onclick="confirmDelete()">OK</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
    let editingId = null;
    let pendingDeleteId = null;
    async function loadClasses() {
        const classes = await window.api.getClasses();
        document.getElementById('classTableBody').innerHTML = classes.map((c, i) => `
            <tr><td><strong>${i+1}</strong></td><td>${c.class_name}</td>
            <td style="text-align:center"><button class="action-btn" onclick="editClass(${c.id}, '${c.class_name}')">✏️</button>
            <button class="action-btn" onclick="openModal(${c.id})">🗑️</button></td></tr>`).join('');
    }
    async function saveClass() {
        const input = document.getElementById('classInput');
        const name = input.value.trim(); if (!name) return;
        if (editingId) { await window.api.updateClass(editingId, name); editingId = null; document.getElementById('saveBtn').innerText = 'Add Class'; }
        else { await window.api.addClass(name); }
        input.value = ''; await loadClasses(); input.focus();
    }
    function openModal(id){ pendingDeleteId = id; document.getElementById('deleteModal').classList.add('show'); }
    function closeModal(){ document.getElementById('deleteModal').classList.remove('show'); pendingDeleteId = null; document.getElementById('classInput').focus(); }
    async function confirmDelete(){
        const id = pendingDeleteId; document.getElementById('deleteModal').classList.remove('show');
        await window.api.deleteClass(id);
        if(editingId === id){ editingId = null; document.getElementById('classInput').value=''; document.getElementById('saveBtn').innerText='Add Class'; }
        pendingDeleteId = null; await loadClasses(); document.getElementById('classInput').focus();
    }
    function editClass(id, name){ editingId = id; const input=document.getElementById('classInput'); input.value=name; document.getElementById('saveBtn').innerText='Update Class'; input.focus(); input.select(); }
    document.getElementById('deleteModal').addEventListener('click', e=>{ if(e.target.id==='deleteModal') closeModal(); });
    loadClasses();
</script>
</body>
</html>
