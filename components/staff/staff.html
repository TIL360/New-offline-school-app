<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; --white: #ffffff; --success: #27ae60; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        
        .back-link { text-decoration: none; color: var(--accent); font-weight: bold; margin-bottom: 15px; display: inline-block; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h2 { color: var(--primary); margin: 0; }

        /* Form Container */
        .staff-grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .card { background: var(--white); padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        
        .btn-save { width: 100%; background: var(--success); color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-save:hover { background: #219150; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th { background: var(--primary); color: white; padding: 12px; text-align: left; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .status-pill { padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .active { background: #d4edda; color: #155724; }
        .inactive { background: #f8d7da; color: #721c24; }

        .btn-action { border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; margin-right: 3px; }
        .edit { background: #3498db; color: white; }
        .delete { background: var(--danger); color: white; }
    </style>
</head>
<body>
<!-- 
    <a href="../dashboard.html" class="back-link">← Back to Dashboard</a> -->
    
    <div class="header">
    <h2>Staff Management</h2>
    <div>
        <button class="btn-apply" onclick="window.location.href='staff-card.html'" style="background: #020e7c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px;">Staff Card</button>
        <button class="btn-apply" onclick="window.location.href='../dashboard.html'" style="background: #020e7c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px;">Dashboard</button>
        <button class="btn-apply" onclick="window.location.href='salary.html'" style="background: #d8da7a; color: rgb(5, 5, 5); border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px;">💵 Salary</button>
        <button onclick="openSalaryModal()" style="background: #e67e22; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px;">💰 Initiate Salary</button>
        <span id="staffStats" style="font-weight: bold; color: var(--primary);">Total Staff: <span id="countText">0</span></span>
    </div>
</div> 

    <div class="staff-grid">
        <!-- Add/Edit Section -->
        <div class="card">
            <h3 style="margin-top:0">Add New Staff</h3>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="staffName" placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>CNIC / ID Number</label>
                <input type="text" id="staffCnic" placeholder="xxxxx-xxxxxxx-x">
            </div>
            <div class="form-group">
                <label>Contact Number</label>
                <input type="text" id="staffContact" placeholder="03xx-xxxxxxx">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex:1">
                    <label>Designation</label>
                    <input type="text" id="staffRole" placeholder="e.g. Teacher">
                </div>
                <div class="form-group" style="flex:1">
                    <label>Status</label>
                    <select id="staffStatus">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Date of Appointment</label>
                <input type="date" id="staffDoj">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex:1">
                    <label>Basic Salary</label>
                    <input type="number" id="staffSalary" placeholder="0">
                </div>
                <div class="form-group" style="flex:1">
                    <label>Allowances</label>
                    <input type="number" id="staffAllowance" placeholder="0">
                </div>
            </div>
            <!-- Inside your 'Add New Staff' Form Layout -->
<div class="row">
    <div class="col-12">
        <label for="staffDocumentsHeld">DOCUMENTS Deposited </label>
        <textarea id="staffDocumentsHeld" class="form-control" placeholder="e.g., Original Matric Degree, B.Ed Certificate, Contract Agreement" rows="2"></textarea>
    </div>
</div>

            <button class="btn-save" onclick="saveStaff()">Add Staff Member</button>
        </div>

        <!-- Staff List Section -->
        <div class="card" style="overflow-x: auto; padding: 0;">
            <table>
                <thead>
                    <tr>
                        <th>Name & Designation</th>
                        <th>CNIC</th>
                        <th>Contact</th>
                        <th>Salary Details</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="staffTableBody">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Simple Salary Modal -->
<div id="salaryModal" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div class="card" style="width: 300px;">
        <h3>Initiate Salary</h3>
        <div class="form-group">
            <label>Month</label>
            <select id="salMonth" class="nice-select" style="width: 100%;">
                <option value="January">January</option><option value="February">February</option>
                <option value="March">March</option><option value="April">April</option>
                <option value="May">May</option><option value="June">June</option>
                <option value="July">July</option><option value="August">August</option>
                <option value="September">September</option><option value="October">October</option>
                <option value="November">November</option><option value="December">December</option>
            </select>
        </div>
        <div class="form-group">
            <label>Year</label>
            <input type="number" id="salYear" value="2026">
        </div>
        <div style="display: flex; gap: 10px;">
            <button onclick="processSalary()" class="btn-save">Generate</button>
            <button onclick="closeSalaryModal()" style="background:#95a5a6;" class="btn-save">Cancel</button>
        </div>
    </div>
</div>
<script>
    let editMode = false;
    let currentEditId = null;

    // Run automatically when the window loads
   document.addEventListener('DOMContentLoaded', () => {
    loadStaff();

    function releaseFocusLock() {
        if (window.authAPI && typeof window.authAPI.send === 'function') {
            window.authAPI.send('fix-focus');
        }
    }

    // 1. SELECT dropdown ka glitch fix (Status wala)
    document.body.addEventListener('change', (event) => {
        if (event.target.tagName === 'SELECT') {
            event.target.blur();
            releaseFocusLock();
        }
    });

    // 2. alert / confirm ka global fix
    const _alert = window.alert;
    window.alert = function(msg) {
        _alert(msg);
        releaseFocusLock();
        setTimeout(() => {
            const nameInput = document.getElementById('fullName') || document.querySelector('input[placeholder="Enter full name"]');
            if (nameInput) nameInput.focus();
        }, 200);
    };

    const _confirm = window.confirm;
    window.confirm = function(msg) {
        const res = _confirm(msg);
        releaseFocusLock();
        return res;
    };
});

    // --- READ: Fetch staff array from backend and draw table rows ---
    async function loadStaff() {
        try {
            // Invokes the IPC handler connected to getStaff() in database.js
            const staff = await window.api.getStaff();
            const tableBody = document.getElementById('staffTableBody');
            tableBody.innerHTML = '';
            
            staff.forEach(s => {
                // Safely convert the object to a string attribute so it handles spaces/quotes cleanly
                const staffData = JSON.stringify(s).replace(/"/g, '&quot;');
                
                tableBody.innerHTML += `
                    <tr>
                        <td><strong>${s.name}</strong><br><small class="text-muted">${s.designation}</small></td>
                        <td>${s.cnic}</td>
                        <td>${s.contact}</td>
                        <td>
                            <small>Bas: ${s.salary}</small><br>
                            <small>All: ${s.allowance}</small>
                        </td>
                        <td><span class="status-pill ${s.status.toLowerCase()}">${s.status}</span></td>
                        <td>
                            <button class="btn-action edit" onclick="startEdit('${staffData}')">✎ Edit</button>
                            <button class="btn-action delete" onclick="removeStaff(${s.id})">✖ Delete</button>
                        </td>
                    </tr>`;
            });
            
            // Updates the counter label at the top right of the dashboard view
            const countLabel = document.getElementById('countText');
            if (countLabel) countLabel.innerText = staff.length;
            
        } catch (error) {
            console.error("Critical error rendering staff view data grid:", error);
        }
    }

    // --- EDIT: Populates all form input elements when clicking "Edit" ---
    function startEdit(staffJson) {
        const staff = JSON.parse(staffJson);
        editMode = true;
        currentEditId = staff.id;

        // Populate standard input elements matching Page 1 layout names
        document.getElementById('staffName').value = staff.name || '';
        document.getElementById('staffCnic').value = staff.cnic || '';
        document.getElementById('staffContact').value = staff.contact || '';
        document.getElementById('staffRole').value = staff.designation || '';
        document.getElementById('staffDoj').value = staff.doj || '';
        document.getElementById('staffSalary').value = staff.salary || 0;
        document.getElementById('staffAllowance').value = staff.allowance || 0;
        document.getElementById('staffStatus').value = staff.status || 'Active';
        
        // 🌟 Fix: Safely load documents held, checking for null values
        const docField = document.getElementById('staffDocumentsHeld');
        if (docField) {
            docField.value = staff.documents_held || '';
        }

        // Alter form submission button appearance to signal update tracking
        const btn = document.querySelector('.btn-save');
        if (btn) {
            btn.innerText = "Update Staff Member";
            btn.style.backgroundColor = "#0288d1"; // Swaps to visual context action blue
        }
        
        // Smooth scroll back to form layout for immediate viewing
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- SAVE: Decides whether to send an update query or fresh record insert ---
    async function saveStaff() {
        const docField = document.getElementById('staffDocumentsHeld');
        
        const data = {
            name: document.getElementById('staffName').value.trim(),
            cnic: document.getElementById('staffCnic').value.trim(),
            contact: document.getElementById('staffContact').value.trim(),
            designation: document.getElementById('staffRole').value.trim(),
            doj: document.getElementById('staffDoj').value,
            salary: parseFloat(document.getElementById('staffSalary').value) || 0,
            allowance: parseFloat(document.getElementById('staffAllowance').value) || 0,
            status: document.getElementById('staffStatus').value,
            documents_held: docField ? docField.value.trim() : ''
        };

        // Basic verification sanity validation block
        if (!data.name || !data.cnic) {
            alert("Validation Error: Please fill in the Full Name and CNIC code parameters.");
            return;
        }

        try {
            // Inside your saveStaff() function in staff.html
if (editMode) {
    // Modifies existing table entry rows
    await window.api.updateStaff(currentEditId, data);
    alert("Staff record updated successfully!");
} else {
    // 🌟 CHANGE THIS ROW TO MATCH YOUR PRELOAD BRIDGING NAME
    await window.api.addStaff(data); 
    alert("New staff member registered successfully!");
}

            
            clearForm();
            await loadStaff(); // Re-render target data changes rows synchronously
        } catch (err) {
            console.error("Database tracking transmission crash:", err);
            alert("Operation failed: " + err.message);
        }
    }

    // --- DELETE: Cascading database row destruction command ---
    async function removeStaff(id) {
        if (confirm("Warning: Are you completely sure you want to remove this staff profile permanently?")) {
            try {
                await window.api.deleteStaff(id);
                await loadStaff();
            } catch (err) {
                console.error("Error deleting entry:", err);
            }
        }
    }

    // --- RESET: Clears form states completely ---
    function clearForm() {
        editMode = false;
        currentEditId = null;
        
        // Explicitly clear each input element by ID so everything clears perfectly
        document.getElementById('staffName').value = '';
        document.getElementById('staffCnic').value = '';
        document.getElementById('staffContact').value = '';
        document.getElementById('staffRole').value = '';
        document.getElementById('staffDoj').value = '';
        document.getElementById('staffSalary').value = '';
        document.getElementById('staffAllowance').value = '';
        document.getElementById('staffStatus').value = 'Active';
        
        // 🌟 Fix: Explicitly reset textarea element tracking values
        const docField = document.getElementById('staffDocumentsHeld');
        if (docField) {
            docField.value = '';
        }
        
        // Return save panel submission button state style configuration to normal green
        const btn = document.querySelector('.btn-save');
        if (btn) {
            btn.innerText = "Add Staff Member";
            btn.style.backgroundColor = ""; // Clear explicit element override colors
        }
    }

    // --- MODAL UTILITIES: Handles your monthly salary triggers ---
    function openSalaryModal() {
        document.getElementById('salaryModal').style.display = 'flex';
    }

    function closeSalaryModal() {
        document.getElementById('salaryModal').style.display = 'none';
    }

    async function processSalary() {
        const month = document.getElementById('salMonth').value;
        const year = document.getElementById('salYear').value;

        try {
            const result = await window.api.initiateSalary(month, year);
            if (result.success) {
                alert(`Success: ${result.count} active staff monthly data slots mapped.`);
                closeSalaryModal();
            } else {
                alert(result.message);
            }
        } catch (err) {
            alert("Execution Error: " + err.message);
        }
    }
</script>


</body>
</html>
